// LEGACY / INACTIVE — retained for historical reference only.
// Modelus runtime, validation, catalog maintenance, versioning, and deployment
// are Lua-only and do not use this Java project.

plugins {
    id 'java'
}

group = 'com.modelus'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

def pzJar = providers.gradleProperty('pzJar')
        .orElse(providers.environmentVariable('PZ_JAR'))
        .getOrElse('D:/SteamLibrary/steamapps/common/ProjectZomboid/projectzomboid.jar')

dependencies {
    compileOnly files(pzJar)
    testImplementation files(pzJar)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
